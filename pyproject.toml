[project]
name = "tenantgate"
version = "0.1.0"
description = "Multitenant OAuth 2.0 / OIDC service on Amazon Cognito with multi-Region resilience"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.0",
    "boto3>=1.35",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[cognitoidp,dynamodb,ssm]>=5.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "boto3-stubs[cognito-idp,dynamodb,ssm,cloudwatch,route53]>=1.35",
]
infra = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/authlib_mt",
    "src/canary",
    "src/control_plane",
    "src/demo_api",
    "src/tenantgate",
    "src/triggers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a deployed dev stack (TG_* environment variables)"]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "infra", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends()/Header() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"scripts/**" = ["S603", "S607"]
"infra/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["authlib_mt", "canary", "control_plane", "demo_api", "stacks", "tenantgate", "triggers"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["authlib_mt", "canary", "control_plane", "demo_api", "tenantgate", "triggers"]

[[tool.mypy.overrides]]
module = ["mangum.*", "moto.*"]
ignore_missing_imports = true

name: deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [dev, prod]
        default: dev
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS, no static keys

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev --group infra
      - name: Unit tests
        run: uv run pytest -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.PRIMARY_REGION || 'ap-southeast-1' }}
      - name: Build Lambda asset
        run: ./scripts/build_lambda.sh
      - name: Deploy
        working-directory: infra
        run: |
          npx --yes aws-cdk@2 deploy --all --require-approval never \
            -c stage="$STAGE" \
            -c domain_name="${{ vars.DOMAIN_NAME }}" \
            -c hosted_zone_id="${{ vars.HOSTED_ZONE_ID }}" \
            -c multi_region="${{ vars.MULTI_REGION || 'false' }}" \
            -c activate_replica="${{ vars.ACTIVATE_REPLICA || 'false' }}" \
            -c token_issuer="${{ vars.TOKEN_ISSUER }}" \
            -c ses_from_email="${{ vars.SES_FROM_EMAIL }}" \
            -c admin_callback_urls="${{ vars.ADMIN_CALLBACK_URLS }}" \
            -c github_repo="${{ github.repository }}"
      - name: Smoke test
        run: |
          curl -fsS "https://api.${{ vars.DOMAIN_NAME }}/control/status"
          curl -fsS "https://api.${{ vars.DOMAIN_NAME }}/demo/health"
